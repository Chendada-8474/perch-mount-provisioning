version: "3.9"

services:
  postgres:
    image: docker.io/postgres:17
    container_name: dev-postgres
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_pass
      POSTGRES_DB: perch_mount
    ports:
      - "5432:5432"
    volumes:
      # - ./postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      bash -c "apt-get update && apt-get install -y postgresql-17-cron &&
      docker-entrypoint.sh postgres"
    restart: always
  migrate:
    image: docker.io/chendada8474/perch-mount-migrate:latest
    container_name: migrate
    volumes:
      - ./env:/app/.env
    depends_on:
      postgres:
        condition: service_healthy

  perch-mount-system:
    image: docker.io/chendada8474/perch-mount-system:latest
    container_name: perch-mount-system
    volumes:
      - ./env:/app/.env
      - ./flask_secret:./app/flask_secret
      - ./jwt_secret:./app/jwt_secret
    ports:
      - 5000:5000
    depends_on:
      - postgres
      - migrate
  
  perch-mount-frontend:
    image: docker.io/chendada8474/perch-mount-frontend:latest
    container_name: perch-mount-frontend
    ports:
      - 5173:5173
    depends_on:
      - perch-mount-system
